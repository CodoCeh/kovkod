<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автоцех — прогоны</title>
<link rel="icon" href="data:image/png;base64,">
<style>
:root{
  --brand:#267354; --bg:#f4f7f5; --panel:#ffffff; --text:#17251e; --subtext:#3c4f46;
  --muted:#5c6a61; --line:rgba(23,37,30,.12); --fill:rgba(23,37,30,.05);
  --ok:#1f7a5a; --warn:#836609; --danger:#b33a31; --ember:#d0763a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#349f74; --bg:#141916; --panel:#1b221e; --text:#e8ede9; --subtext:#c7d6cd;
    --muted:#82978b; --line:rgba(232,237,233,.2); --fill:rgba(232,237,233,.06);
    --ok:#4fc39a; --warn:#e0a82e; --danger:#e8695e; --ember:#e8944f;
  }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:960px; margin:0 auto; padding:28px 20px 48px}
.top{display:flex; align-items:center; gap:12px; margin:0 0 6px}
h1{font-size:22px; margin:0; font-weight:600; letter-spacing:-.01em}
.sub{color:var(--subtext); font-size:14px; margin:0 0 22px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin:0 0 12px; display:block; text-decoration:none; color:inherit}
a.panel:hover{border-color:var(--brand)}
.row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.row h2{font-size:16px; margin:0; font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere}
.tag{font-size:12.5px; color:var(--muted); white-space:nowrap}
.tag b{color:var(--text); font-weight:600}
.meta{color:var(--subtext); font-size:13px; margin:6px 0 0; overflow-wrap:anywhere}
.bar{height:6px; background:var(--fill); border-radius:3px; overflow:hidden; display:flex; margin:10px 0 0}
.bar i{display:block; height:100%}
.bar i.done{background:var(--brand)} .bar i.live{background:var(--brand); opacity:.42}
.bar i.bad{background:var(--danger)}
.empty{color:var(--muted); padding:10px 0}
footer{margin-top:26px; padding-top:16px; border-top:1px solid var(--line);
  display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted)}
footer a{display:inline-flex; align-items:center; gap:8px; color:var(--muted);
  text-decoration:none; min-height:24px}
footer a:hover{color:var(--brand)}
footer img{width:20px; height:20px; border-radius:5px; display:block}
/* Кузница — брендовый мотив КодоЦеха: тот же, что в строке «Выковано в КодоЦех».
   Молот бьёт, пока идёт работа; когда прогон закрыт, остаётся тлеющий уголёк.
   Анимация чисто декоративная и отключается при prefers-reduced-motion. */

.forge{flex:0 0 auto; overflow:visible}
.forge-anvil path{fill:var(--text); opacity:.82}
.forge-horn{opacity:.62}
.forge-handle{fill:var(--muted)}
.forge-head{fill:var(--text); opacity:.9}
.forge-glow{fill:var(--ember); opacity:.14; filter:blur(3px)}
.forge-sparks circle{fill:var(--ember); opacity:0}
.forge-wave{fill:none; stroke:var(--ember); stroke-width:1.1; opacity:0}

.forge-hammer{transform-origin:24px 24px; transform:rotate(-30deg)}
.forge-anvil{transform-origin:24px 34px}

/* Работа идёт: удар, отскок, искры на контакте. */
[data-forge="forging"] .forge-hammer{animation:forge-strike 1.05s cubic-bezier(.6,0,.35,1) infinite}
[data-forge="forging"] .forge-anvil{animation:forge-squash 1.05s ease-out infinite}
[data-forge="forging"] .forge-glow{animation:forge-heat 1.05s ease-out infinite}
[data-forge="forging"] .forge-wave{animation:forge-wave 1.05s ease-out infinite}
[data-forge="forging"] .forge-sparks circle{animation:forge-spark 1.05s ease-out infinite}

@keyframes forge-strike{
  0%{transform:rotate(-32deg)}
  34%{transform:rotate(2deg)}
  40%{transform:rotate(0deg)}
  70%{transform:rotate(-32deg)}
  100%{transform:rotate(-32deg)}
}
@keyframes forge-squash{
  0%,32%{transform:scaleY(1)}
  36%{transform:scaleY(.94)}
  46%,100%{transform:scaleY(1)}
}
@keyframes forge-heat{
  0%,30%{opacity:.12}
  36%{opacity:.4}
  70%,100%{opacity:.12}
}
@keyframes forge-wave{
  0%,33%{opacity:0; r:3}
  38%{opacity:.5; r:5}
  55%{opacity:0; r:11}
  100%{opacity:0; r:3}
}
@keyframes forge-spark{
  0%,33%{opacity:0; transform:translate(0,0) scale(.4)}
  37%{opacity:1; transform:translate(0,0) scale(1)}
  62%{opacity:0}
  100%{opacity:0}
}
/* Искры разлетаются в разные стороны — иначе это одна точка, а не сноп. */
.forge-sparks circle{transform-box:fill-box; transform-origin:center}
[data-forge="forging"] .forge-sparks circle:nth-child(1){animation-name:forge-spark-a}
[data-forge="forging"] .forge-sparks circle:nth-child(2){animation-name:forge-spark-b}
[data-forge="forging"] .forge-sparks circle:nth-child(3){animation-name:forge-spark-c}
[data-forge="forging"] .forge-sparks circle:nth-child(4){animation-name:forge-spark-d}
[data-forge="forging"] .forge-sparks circle:nth-child(5){animation-name:forge-spark-e}
[data-forge="forging"] .forge-sparks circle:nth-child(6){animation-name:forge-spark-f}

@keyframes forge-spark-a{0%,33%{opacity:0;transform:translate(0,0) scale(.3)}
  38%{opacity:1;transform:translate(-5px,-5px) scale(1)}
  65%{opacity:0;transform:translate(-13px,-8px) scale(.2)}100%{opacity:0}}
@keyframes forge-spark-b{0%,33%{opacity:0;transform:translate(0,0) scale(.3)}
  38%{opacity:1;transform:translate(5px,-5px) scale(1)}
  65%{opacity:0;transform:translate(13px,-9px) scale(.2)}100%{opacity:0}}
@keyframes forge-spark-c{0%,34%{opacity:0;transform:translate(0,0) scale(.3)}
  39%{opacity:1;transform:translate(-2px,-7px) scale(1)}
  68%{opacity:0;transform:translate(-5px,-16px) scale(.2)}100%{opacity:0}}
@keyframes forge-spark-d{0%,34%{opacity:0;transform:translate(0,0) scale(.3)}
  39%{opacity:1;transform:translate(3px,-7px) scale(1)}
  68%{opacity:0;transform:translate(7px,-15px) scale(.2)}100%{opacity:0}}
@keyframes forge-spark-e{0%,33%{opacity:0;transform:translate(0,0) scale(.3)}
  37%{opacity:.9;transform:translate(-8px,-2px) scale(.9)}
  60%{opacity:0;transform:translate(-16px,-1px) scale(.2)}100%{opacity:0}}
@keyframes forge-spark-f{0%,33%{opacity:0;transform:translate(0,0) scale(.3)}
  37%{opacity:.9;transform:translate(8px,-2px) scale(.9)}
  60%{opacity:0;transform:translate(16px,-2px) scale(.2)}100%{opacity:0}}

/* Работа закончена — молот отставлен, металл остывает. */
[data-forge="idle"] .forge-hammer{transform:rotate(-38deg); opacity:.45}
[data-forge="idle"] .forge-glow{animation:forge-ember 3.4s ease-in-out infinite}
@keyframes forge-ember{0%,100%{opacity:.07} 50%{opacity:.2}}

@media (prefers-reduced-motion:reduce){
  .forge *{animation:none !important}
  [data-forge="forging"] .forge-glow{opacity:.28}
}
</style>
</head>

function shortTitle(t){
  if (!t) return "Прогон";
  const stop = t.search(/[.!?]\s/);
  const head = stop > 12 ? t.slice(0, stop) : t;
  return head.length > 78 ? head.slice(0, 78).replace(/\s\S*$/, "") + "…" : head;
}
function dur(msec){
  if (msec == null || msec < 0) return "—";
  const s = Math.round(msec/1000);
  if (s < 60) return s + " с";
  const m = Math.floor(s/60);
  if (m < 60) return m + " мин";
  const h = Math.floor(m/60);
  return h + " ч" + (m % 60 ? " " + (m % 60) + " мин" : "");
}

async function load(){
  const runs = [];
  for (const slug of SLUGS){
    try{
      const st = await (await fetch(`${slug}/state.json?t=${Date.now()}`)).json();
      runs.push({slug, st});
    }catch{}
  }
  runs.sort((a,b) => Date.parse(b.st.started_at||0) - Date.parse(a.st.started_at||0));

  const live = runs.filter(r => !r.st.finished_at).length;
  document.body.dataset.forge = live ? "forging" : "idle";
  document.getElementById("sub").textContent = runs.length
    ? `${runs.length} ${runs.length === 1 ? "прогон" : "прогонов"}` + (live ? `, из них идёт ${live}` : ", все закрыты")
    : "Прогонов пока нет.";

  document.getElementById("list").innerHTML = runs.length ? runs.map(({slug, st}) => {
    const tasks = st.tasks || [];
    const done = tasks.filter(t => t.status === "done").length;
    const bad = tasks.filter(t => t.status === "failed").length;
    const busy = tasks.length - done - bad;
    // Date.parse от числа даёт NaN — конец берём числом, а не через парсер.
    const end = st.finished_at ? Date.parse(st.finished_at) : Date.now();
    const span = dur(end - Date.parse(st.started_at));
    const gates = st.gates || {};
    const passed = Object.keys(gates).filter(g => gates[g].status === "passed").length;
    return `<a class="panel" href="${esc(slug)}/dashboard.html">
      <div class="row">
        <h2>${esc(shortTitle(st.title))}</h2>
        <span class="tag">${st.finished_at ? "✅ закрыт" : "⏳ идёт"} <b>${span}</b></span>
      </div>
      <p class="meta">масштаб ${esc(SCALE_RU[st.tier] || st.tier)} · режим ${esc(st.mode)}
        · задачи ${done} из ${tasks.length} · гейтов пройдено ${passed}
        · начат ${esc((st.started_at||"").slice(0,16).replace("T"," "))}</p>
      <div class="bar">
        ${tasks.length ? `<i class="done" style="width:${done/tasks.length*100}%"></i>
        <i class="live" style="width:${busy/tasks.length*100}%"></i>
        <i class="bad" style="width:${bad/tasks.length*100}%"></i>` : ""}
      </div>
    </a>`;
  }).join("") : `<div class="panel empty">Ни одного прогона в этом проекте. Заведите: <code>ceh init "что построить"</code></div>`;
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
