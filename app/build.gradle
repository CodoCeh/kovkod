plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codoceh.stol'
    compileSdk 36

    defaultConfig {
        applicationId "ru.codoceh.stol"
        minSdk 28
        // targetSdk 28: с targetSdk 29+ Android запрещает запуск файлов из каталога данных
        // приложения, а без этого proot из assets не запустить.
        targetSdk 28
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        // Образ уже сжат zstd: второй раз жать его при сборке APK незачем.
        noCompress 'zst'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Разбор .tar на стороне Android: Apache-2.0, копилефта нет.
    implementation 'org.apache.commons:commons-compress:1.27.1'
    // Распаковка .zst внутри приложения: BSD 2-Clause, тоже разрешительная.
    implementation 'com.github.luben:zstd-jni:1.5.7-3@aar'

    testImplementation 'junit:junit:4.13.2'
    // Тот же zstd, но со сборками под настольные ОС: тесты делают настоящий .tar.zst.
    testImplementation 'com.github.luben:zstd-jni:1.5.7-3'
}
