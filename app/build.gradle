plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codoceh.stol'
    compileSdk 36

    defaultConfig {
        applicationId "ru.codoceh.stol"
        minSdk 28
        // Потолка больше нет: исполняемые файлы лежат в каталоге родных библиотек
        // (`src/main/jniLibs/arm64-v8a/lib*.so`), а не в данных приложения, поэтому
        // запрет W^X с Android 10 их не касается — см. assets/native/SOURCES.md.
        targetSdk 36
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        // Образ уже сжат zstd: второй раз жать его при сборке APK незачем.
        noCompress 'zst'
    }

    packaging {
        jniLibs {
            // extractNativeLibs=true: установщик распаковывает lib*.so в nativeLibraryDir,
            // и только оттуда система разрешает запуск. Внутри APK запускать нечего.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            // Кузница — это View, и её кадры считаются от Canvas. Без этого любой вызов
            // заглушки android.jar падает «Stub!», и расчёт кадра нечем сверить с каноном:
            // проверка анимации сводится к «посмотрел на телефон, вроде похоже».
            returnDefaultValues = true
        }
    }
}

// Список программ — такой же вход проверки, как исходники: без этого его правка проезжает
// под UP-TO-DATE, тесты не перезапускаются и зелёный цвет ничего не доказывает.
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/main/assets') { include 'apps.json' })
            .withPropertyName('appsCatalog')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // Отказ читается прямо в терминале: по умолчанию Gradle печатает один класс
    // исключения, а текст — где искали, что положить и почему это важно — остаётся
    // лежать в html-отчёте, куда в спешке никто не заглядывает.
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }

    // Канон кузницы лежит в соседнем репозитории и в исходники не входит: без явного
    // объявления входом его пропажа проезжает под UP-TO-DATE, задача не запускается и
    // проверка остаётся зелёной, ничего не сверив.
    def canonPlaces = []
    def near = project.projectDir
    for (int depth = 0; depth < 6 && near != null; depth++) {
        canonPlaces << new File(near, 'CodocehDesktopLauncher/app/src/main/java/'
                + 'ru/codoceh/desktoplauncher/ForgeView.java')
        near = near.parentFile
    }
    inputs.files(canonPlaces).withPropertyName('forgeCanon').optional()

    // Заявление «репозитория лаунчера у меня нет» доезжает до тестовой JVM только явной
    // передачей: своих свойств она не наследует. Без заявления сверка кузницы с каноном
    // краснеет — молчаливого пропуска у неё больше нет.
    if (project.hasProperty('stol.forge.canon.absent')) {
        systemProperty 'stol.forge.canon.absent', project.property('stol.forge.canon.absent')
    }
}

dependencies {
    // Разбор .tar на стороне Android: Apache-2.0, копилефта нет.
    implementation 'org.apache.commons:commons-compress:1.27.1'
    // Распаковка .zst внутри приложения: BSD 2-Clause, тоже разрешительная.
    implementation 'com.github.luben:zstd-jni:1.5.7-3@aar'
    // FileProvider для картиночной ветки буфера обмена (Extended Clipboard, spec.md R02.2/R09.1).
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
    // Тот же zstd, но со сборками под настольные ОС: тесты делают настоящий .tar.zst.
    testImplementation 'com.github.luben:zstd-jni:1.5.7-3'
}
