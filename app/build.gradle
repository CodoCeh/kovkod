plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codoceh.stol'
    compileSdk 36

    defaultConfig {
        applicationId "ru.codoceh.stol"
        minSdk 28
        // targetSdk 28: с targetSdk 29+ Android запрещает запуск файлов из каталога данных
        // приложения, а без этого proot из assets не запустить.
        targetSdk 28
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
